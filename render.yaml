# Render Blueprint - SEN371 E-Commerce (Milestone 6)
# Database: Supabase PostgreSQL (not managed here). Secrets are sync:false,
# so Render asks for them in the dashboard and they never enter the repo.
services:
  - type: web
    name: sen371-ecommerce-api
    runtime: docker
    dockerContext: ./src
    dockerfilePath: ./src/Dockerfile
    region: frankfurt          # nearest Render region to Supabase eu-west-1
    plan: free
    healthCheckPath: /health   # includes a PostgreSQL connectivity check
    autoDeploy: true
    envVars:
      - key: ConnectionStrings__DefaultConnection
        sync: false            # Supabase *session pooler* string (IPv4), SSL Mode=Require
      - key: Jwt__Key
        generateValue: true    # random 256-bit value generated by Render
      - key: Jwt__Issuer
        value: ECommerceApi
      - key: Jwt__Audience
        value: ECommerceApiClient
      - key: Cors__AllowedOrigins__0
        sync: false            # the static site URL, e.g. https://sen371-ecommerce-web.onrender.com

  - type: web
    name: sen371-ecommerce-web
    runtime: static
    rootDir: frontend
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    autoDeploy: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false            # the API URL, e.g. https://sen371-ecommerce-api.onrender.com (no trailing slash)
      - key: NODE_VERSION
        value: "22"
    routes:
      # Client-side routing: /products/123, /admin/orders etc. must serve the SPA.
      - type: rewrite
        source: /*
        destination: /index.html
